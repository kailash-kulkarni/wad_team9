<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#183b35" name="theme-color"/>
  <title>
   Faculty Office | Academic operations
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
   <symbol id="grid" viewbox="0 0 24 24">
    <rect height="7" rx="1" width="7" x="3" y="3">
    </rect>
    <rect height="7" rx="1" width="7" x="14" y="3">
    </rect>
    <rect height="7" rx="1" width="7" x="3" y="14">
    </rect>
    <rect height="7" rx="1" width="7" x="14" y="14">
    </rect>
   </symbol>
   <symbol id="users" viewbox="0 0 24 24">
    <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
    </path>
    <circle cx="10" cy="7" r="4">
    </circle>
    <path d="M20 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8">
    </path>
   </symbol>
   <symbol id="calendar" viewbox="0 0 24 24">
    <rect height="16" rx="2" width="18" x="3" y="5">
    </rect>
    <path d="M16 3v4M8 3v4M3 11h18">
    </path>
   </symbol>
   <symbol id="book" viewbox="0 0 24 24">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z">
    </path>
    <path d="M8 7h8M8 11h7">
    </path>
   </symbol>
   <symbol id="chart" viewbox="0 0 24 24">
    <path d="M3 3v18h18M19 9l-5 5-4-4-5 5">
    </path>
   </symbol>
   <symbol id="search" viewbox="0 0 24 24">
    <circle cx="11" cy="11" r="7">
    </circle>
    <path d="m20 20-4-4">
    </path>
   </symbol>
   <symbol id="plus" viewbox="0 0 24 24">
    <path d="M12 5v14M5 12h14">
    </path>
   </symbol>
   <symbol id="download" viewbox="0 0 24 24">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3">
    </path>
   </symbol>
   <symbol id="clock" viewbox="0 0 24 24">
    <circle cx="12" cy="12" r="9">
    </circle>
    <path d="M12 7v5l3 2">
    </path>
   </symbol>
   <symbol id="close" viewbox="0 0 24 24">
    <path d="m18 6-12 12M6 6l12 12">
    </path>
   </symbol>
   <symbol id="edit" viewbox="0 0 24 24">
    <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z">
    </path>
   </symbol>
   <symbol id="trash" viewbox="0 0 24 24">
    <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6">
    </path>
   </symbol>
   <symbol id="alert" viewbox="0 0 24 24">
    <path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8-14a2 2 0 0 0-3.4 0ZM12 9v4m0 4h.01">
    </path>
   </symbol>
  </svg>
  <aside class="sidebar" id="sidebar">
   <div class="brand">
    <div class="brand-mark">
     <svg>
      <use href="#book">
      </use>
     </svg>
    </div>
    <div>
     <div class="brand-name">
      Faculty Office
     </div>
     <div class="brand-sub">
      Academic operations
     </div>
    </div>
   </div>
   <div class="nav-label">
    Workspace
   </div>
   <nav aria-label="Main navigation" class="nav-list">
    <button class="nav-button active" data-view="overview">
     <svg>
      <use href="#grid">
      </use>
     </svg>
     Overview
    </button>
    <button class="nav-button" data-view="faculty">
     <svg>
      <use href="#users">
      </use>
     </svg>
     Faculty
     <span class="nav-count" id="facultyCount">
     </span>
    </button>
    <button class="nav-button" data-view="schedule">
     <svg>
      <use href="#calendar">
      </use>
     </svg>
     Schedule
    </button>
    <button class="nav-button" data-view="subjects">
     <svg>
      <use href="#book">
      </use>
     </svg>
     Subjects
     <span class="nav-count" id="subjectCount">
     </span>
    </button>
    <button class="nav-button" data-view="workload">
     <svg>
      <use href="#chart">
      </use>
     </svg>
     Workload
    </button>
   </nav>
   <div class="sidebar-bottom">
    <div class="avatar">
     AM
    </div>
    <div>
     <div class="user-name">
      Alex Morgan
     </div>
     <div class="user-role">
      Department administrator
     </div>
    </div>
   </div>
  </aside>
  <main class="main">
   <header class="topbar">
    <button aria-label="Open navigation" class="menu" id="menu">
     <svg>
      <use href="#grid">
      </use>
     </svg>
    </button>
    <div class="crumb">
     <span>
      Faculty Office
     </span>
     <span>
      /
     </span>
     <strong id="crumb">
      Overview
     </strong>
    </div>
    <div class="top-actions">
     <div class="term">
      <i>
      </i>
      Fall semester 2026
     </div>
     <div class="top-avatar">
      AM
     </div>
    </div>
   </header>
   <section aria-live="polite" class="page" id="page">
   </section>
  </main>
  <dialog class="modal" id="modal">
  </dialog>
  <div class="toast" id="toast" role="status">
  </div>
  <script src="app.js"></script>
 </body>
</html>
